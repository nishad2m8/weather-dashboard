<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Windy Map</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: #f5f5f5;
        }

        .container {
            width: 800px;
            height: 480px;
            overflow: hidden;
            background: white;
        }

        .windy-map {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .windy-map iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="windy-map">
            <iframe
                src="https://embed.windy.com/embed2.html?lat=17&lon=65&detailLat=25.98&detailLon=50.5577&width=800&height=480&zoom=4&level=surface&overlay=rain&product=ecmwf&menu=&message=&marker=&calendar=&pressure=&type=map&location=coordinates&detail=&metricWind=default&metricTemp=°C"
                frameborder="0">
            </iframe>
        </div>
    </div>
</body>
</html>
